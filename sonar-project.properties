# SonarQube Cloud scanner configuration (run by CI on every push and PR;
# see .github/workflows/sonarqube.yml).
#
# SonarQube Cloud requires sonar.organization and namespaces the project key
# as <owner>_<repo>. Confirm both against the values Cloud assigns at import
# (Administration -> Information).
sonar.organization=alteredparadox
sonar.projectKey=AlteredParadox_pmss-fleet-manager
sonar.projectName=pmss-fleet-manager
sonar.sourceEncoding=UTF-8

# Standard Go layout: everything is a source, *_test.go is the test set.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*_test.mjs

# Exclusions, each for a concrete reason:
#   *_test.go      — the test set (declared above), not sources.
#   design/**      — the Claude Design mockup the UI was built from;
#                    reference material, not shipped code.
#   node_modules/** — the ESLint install `make jscheck` makes; not ours.
sonar.exclusions=**/*_test.go,design/**,node_modules/**

# Go coverage from `go test -coverprofile` (produced by the workflow).
sonar.go.coverage.reportPaths=coverage.out

# Coverage is imported for Go ONLY. The front end has one Node test (the
# revision merge in internal/web/revisions_test.mjs, run by make jscheck)
# but no coverage report is produced for it, and the page script itself
# is browser code with no harness, so JS coverage would only drag new-code
# coverage down. This is a COVERAGE exclusion only: the scripts stay in
# sonar.sources and are still analysed for bugs and smells.
sonar.coverage.exclusions=internal/web/static/**

# Deliberate rule exceptions belong HERE, not in the Cloud UI: issue
# resolutions live in the server's database and do not survive a project or
# platform move, whereas this file is in git. Add them as
# sonar.issue.ignore.multicriteria entries with a comment saying why.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15

# e1: cognitive complexity in TESTS ONLY. Table-driven tests are the house
# style, and the metric counts every table row and per-step assertion
# against the single test function, which is the shape we want.
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go

# e2: "DOM XSS via unsanitized user input" on the innerHTML writes in app.js.
# The UI renders template literals into innerHTML by design; every API or
# user string passes through esc() (HTML entity escaping) and the review loop
# audited each interpolation. The taint engine cannot see a hand-written
# sanitiser, so this is a known false positive here, not an exception for
# new code: any new interpolation must still go through esc().
sonar.issue.ignore.multicriteria.e2.ruleKey=jssecurity:S5696
sonar.issue.ignore.multicriteria.e2.resourceKey=internal/web/static/app.js

# e3: "Using HTTP protocol is insecure" for the two http:// literals. The
# qBittorrent Web API is reached at 127.0.0.1:<port> ON THE BOX through the
# SSH tunnel (encrypted end to end; qBittorrent does not serve TLS there),
# and main.go only prints the listen address for the operator.
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.go

# e4: "Remove this context.Context field". Manager and poller hold their
# LIFETIME contexts (cancelled by Stop / stopAndWait) so that work started
# from HTTP handlers can be tied to the owner's lifetime via AfterFunc; every
# per-call context is still passed as a parameter.
sonar.issue.ignore.multicriteria.e4.ruleKey=godre:S8242
sonar.issue.ignore.multicriteria.e4.resourceKey=internal/collect/*.go

# e5/e6: nested ternaries and nested template literals in app.js. The front
# end is one hand-written file that renders template literals into innerHTML;
# conditional fragments inside those templates are the house style there,
# and every interpolation was audited in the 2026-10 review loop. Rewriting
# the templates would be churn without a safety gain. Decided 2026-10-17.
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.e5.resourceKey=internal/web/static/app.js
sonar.issue.ignore.multicriteria.e6.ruleKey=javascript:S4624
sonar.issue.ignore.multicriteria.e6.resourceKey=internal/web/static/app.js

# e7-e12 (one entry per file; the matcher has no brace globs): cognitive
# complexity at 17-25 in the parsers, API handlers and main.
# The functions above 30 were split into helpers (2026-10-17); the remaining
# ones are linear field-by-field parsers and request handlers whose branches
# are the input shapes themselves (parseQuotaLine, parseCgroup, phpserial
# decode, handleUpdateBox/handleDetect/handleSetSettings, main's flag and
# listener setup, sanitizeFloats, pollQbt). Splitting them would scatter one
# input format over several functions. Decided 2026-10-17; new code in these
# files is still expected to stay under the threshold.
sonar.issue.ignore.multicriteria.e7.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e7.resourceKey=cmd/pmss-fleet-manager/main.go
sonar.issue.ignore.multicriteria.e8.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e8.resourceKey=internal/api/api.go
sonar.issue.ignore.multicriteria.e9.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e9.resourceKey=internal/phpserial/phpserial.go
sonar.issue.ignore.multicriteria.e10.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e10.resourceKey=internal/collect/state.go
sonar.issue.ignore.multicriteria.e11.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e11.resourceKey=internal/collect/poller.go
sonar.issue.ignore.multicriteria.e12.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e12.resourceKey=internal/probe/probe.go

# e13: the same mid-range complexity exception for the front end. The four
# functions above 30 (tabOverview, viewAdd, the click handler, viewBox) were
# split into helpers on 2026-10-17; the remaining 17-24 ones (fleetCards,
# tabStorage, tabHost, the input handler) are one renderer or handler per
# view whose branches are the fields they render. Same expectation as e7:
# new code stays under the threshold.
sonar.issue.ignore.multicriteria.e13.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e13.resourceKey=internal/web/static/app.js

# e14: "unexpected await inside a loop" in app.js. The one place it fires is
# the event stream's resync loop: a retry with backoff that must wait for
# the previous attempt before making the next, so awaiting inside the loop
# is the behaviour, not an oversight. Decided 2026-10-22.
sonar.issue.ignore.multicriteria.e14.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.e14.resourceKey=internal/web/static/app.js

# Base images carry both the tag and the digest on purpose: the digest pins
# the image, the tag keeps the pin readable and is what Dependabot (docker
# ecosystem) bumps (see the Dockerfile's header).
sonar.issue.ignore.multicriteria.e15.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e15.resourceKey=Dockerfile
