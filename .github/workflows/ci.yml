# Merge gate: the checks a change must pass. `make vet` (gofmt + go vet),
# `make build` and `make test` are the project's own targets, so CI runs
# exactly what a developer runs locally; the race suite runs separately
# because the pollers, event bus and caches are concurrent by design.
name: ci

# push only on main; branch pushes are covered by their pull_request run,
# so PRs (including Dependabot's) don't run this twice.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only reads the repo.
permissions:
  contents: read

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (a retagged action can't change
      # under us); the trailing comment records the tag. Keep the comment at
      # the FULL version — Dependabot only refreshes a comment that already
      # carries one, and a bare "# v7" silently goes stale as the SHA moves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # gofmt -l (fails on any unformatted file) + go vet ./...
      - name: make vet
        run: make vet

      # Node for `make jscheck`: the version is pinned here and the ESLint
      # tree by package-lock.json, so the lint runs the same code everywhere.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # node --check + ESLint no-undef on the frontend: a reference to an
      # undefined helper is a ReferenceError at click time that no Go
      # test sees (the Edit route shipped broken that way once).
      - name: make jscheck
        run: make jscheck

      # Every first-party source carries the AGPL notice. Cheap and offline,
      # so unlike notices-check this one is safe to gate every PR on —
      # Dependabot never touches source headers.
      - name: make license-check
        run: make license-check

      # The trimmed static binary the README documents.
      - name: make build
        run: make build

      # The box-to-box copy tests run the real job scripts locally against
      # rsync and rrsync (Ubuntu's rsync package ships /usr/bin/rrsync);
      # with CI set they fail rather than skip when a tool is missing.
      # ubuntu-latest carries a current rsync (3.4.1 on 26.04); the boxes'
      # Debian 12's is covered by the rsync-debian-12 job below.
      - name: Install rsync
        run: sudo apt-get install -y --no-install-recommends rsync

      - name: make test
        run: make test

      # Pollers, the SSE bus, the services cache and the qBittorrent backoff
      # state are all shared across goroutines — this is the suite that pins
      # them.
      - name: Race tests
        run: go test -race ./...

  # The copy scripts against the rsync and rrsync the boxes run: whatever
  # Debian 12 ships, security updates included, since every PMSS box is a
  # Debian 12 box that takes them (fred on PR 162: ubuntu-latest had moved
  # to 3.4.1, so the main job no longer proved the production version).
  # That was 3.2.7 until DSA-6282-1 (2026-11) moved bookworm-security to
  # 3.5.0, so the guard checks the package is Debian 12's build (+deb12),
  # not a version number; the version is printed. Only the transfer tests,
  # in a bookworm container; its own job so a package-mirror hiccup does
  # not block the required `check`.
  rsync-debian-12:
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install Debian 12's rsync and the tools the job scripts use
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            rsync python3 perl util-linux openssh-client procps ca-certificates git
          rsync --version | head -1
          dpkg-query -W -f '${Version}\n' rsync | grep -q 'deb12' || { echo "not Debian 12's rsync package"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Transfer tests on Debian 12's rsync
        run: go test -run 'Xfer|Transfer|ParseDst' ./internal/collect

  # Known-vulnerability scan of what the binary actually links (stdlib
  # included). Its own job, NOT the required `check`: a fresh stdlib advisory
  # would otherwise turn every open PR red for a reason the PR can't fix —
  # the fix is bumping the `toolchain` line in go.mod, which is what this job
  # exists to flag. Symbol-level, so advisories in code we don't call are
  # informational only.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The container image builds and starts. Its own job, NOT the required
  # `check`: it repeats the Go build inside Docker and its failure modes
  # (registry hiccups, a base-image digest moving) are not the PR's fault.
  # amd64 only here; the release workflow builds both arches and pushes.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pmss-fleet-manager:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke test: the distroless image starts as nonroot, hardened the way
      # the README suggests (read-only root filesystem with no /tmp tmpfs,
      # every capability dropped, no-new-privileges), creates its database
      # on the volume and answers the state endpoint; its own HEALTHCHECK
      # turns healthy; and an upload past 1 MiB is parsed without a writable
      # temp directory (a disabled box answers 409 after the form is read; a
      # parse failure would be 400).
      - name: Run image
        run: |
          docker run -d --name smoke --read-only --cap-drop ALL --security-opt no-new-privileges \
            --health-interval 2s -p 127.0.0.1:8080:8080 pmss-fleet-manager:ci
          for i in $(seq 1 30); do
            if out=$(curl -sf http://127.0.0.1:8080/api/state); then break; fi
            sleep 1
          done
          echo "$out" | grep -q '"version":"ci"' || { docker logs smoke; exit 1; }
          for i in $(seq 1 30); do
            health=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$health" = healthy ] && break
            sleep 1
          done
          [ "$health" = healthy ] || { echo "health: $health"; docker inspect -f '{{json .State.Health}}' smoke; docker logs smoke; exit 1; }
          python3 -c "import sys; sys.stdout.buffer.write(b'd4:info' + b'x' * (2 << 20) + b'e')" > big.torrent
          box=$(curl -sf -H 'X-PMSS-Request: 1' -H 'Content-Type: application/json' \
            -d '{"name":"smoke","host":"smoke.invalid","user":"u","enabled":false}' http://127.0.0.1:8080/api/boxes) \
            || { echo "create box failed"; docker logs smoke; exit 1; }
          id=$(echo "$box" | jq -r .id) rev=$(echo "$box" | jq -r .revision)
          code=$(curl -s -o resp.txt -w '%{http_code}' -H 'X-PMSS-Request: 1' -F torrents=@big.torrent "http://127.0.0.1:8080/api/boxes/$id/qbt/torrents?rev=$rev")
          [ "$code" = 409 ] && grep -q disabled resp.txt || { echo "upload: $code $(cat resp.txt)"; docker logs smoke; exit 1; }
          docker stop smoke >/dev/null
